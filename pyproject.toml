[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-evaluation-lab"
version = "0.1.0"
description = "Reproducible local model benchmarks, history, and HTML reports for Ollama"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Karden Karwan"}]

[project.scripts]
model-lab = "model_lab.__main__:main"
